name: Release

# Run from the Actions tab: pick the version bump, and this tests, bumps package.json,
# publishes to npm (with provenance), pushes the tag and creates a GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major, prerelease]
        default: patch

permissions:
  contents: write # push the version commit/tag, create the release
  id-token: write # npm trusted publishing + provenance

concurrency: release

env:
  VOXLINGUA107_CACHE_DIR: ${{ github.workspace }}/.cache/model

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5 for trusted publishing
          registry-url: https://registry.npmjs.org
      - uses: actions/cache@v4
        with:
          path: .cache/model
          key: voxlingua107-model-e2c3c3da39b99e3f

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run test:node

      - name: Bump version
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ inputs.bump }} --preid beta -m "release: v%s"
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --provenance --access public ${{ inputs.bump == 'prerelease' && '--tag beta' || '' }}
        env:
          # Optional: only needed until trusted publishing is configured on npmjs.com.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push tag and create GitHub release
        run: |
          git push --follow-tags
          gh release create "v${{ steps.version.outputs.version }}" --generate-notes \
            ${{ inputs.bump == 'prerelease' && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
